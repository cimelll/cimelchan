<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cplay — Hosting & Tools</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Latar animasi -->
  <div class="bg-float bg-1"></div>
  <div class="bg-float bg-2"></div>
  <div class="bg-float bg-3"></div>
  <div class="bg-float bg-4"></div>

  <div class="container">
    <!-- Logo animasi -->
    <div class="logo-box">
      <div class="logo-icon">
        <span class="chibi">☁️</span>
      </div>
      <h1 class="judul">Cplay</h1>
      <p class="sub-judul">Buat & Hosting Web Kamu Sendiri</p>
    </div>

    <!-- Tombol Menu -->
    <div class="menu-grid">
      <button class="menu-btn" onclick="bukaHalaman('deploy')">
        <span class="ikon-btn">🚀</span>
        <span>Deploy Web</span>
      </button>
      <button class="menu-btn" onclick="bukaHalaman('tools')">
        <span class="ikon-btn">🛠️</span>
        <span>Alat Bantu</span>
      </button>
      <button class="menu-btn" onclick="bukaHalaman('tentang')">
        <span class="ikon-btn">💙</span>
        <span>Tentang</span>
      </button>
      <button class="menu-btn" onclick="bukaHalaman('kredit')">
        <span class="ikon-btn">✨</span>
        <span>Kredit</span>
      </button>
    </div>

    <!-- Info -->
    <div class="info-box">
      <p class="teks-animasi">Selamat datang di Cplay — tempat bikin web jadi mudah dan seru!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
      </html>
